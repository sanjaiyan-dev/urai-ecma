[package]
name = "urai-ecma"
version = "0.1.0"
edition = "2024"
authors = ["Sanjaiyan <sanjaiyan.pro@gmail.com>"]
license = "MIT"
repository = "https://github.com/sanjaiyan-dev/urai-ecma"
homepage = "https://sanjaiyan-dev.github.io/urai-ecma/"
documentation = "https://sanjaiyan-dev.github.io/urai-ecma/"
description = "AST-aware JS/TS code to prompt engine for LLMs"
readme = "README.md"
keywords = ["ast", "llm", "prompt", "typescript", "swc"]
categories = ["command-line-utilities", "development-tools", "compilers"]

include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "urai.config.jsonc",
]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env", "suggestions"] }
const-hex = "1.19.1"
foyer = { version = "0.22.3", features = ["serde"] }
ignore = "0.4.31"
jsdoc = { version = "23.0.0", features = ["serde"] }
json5 = "1.3.1"
petgraph = { version = "0.8.3", features = ["all"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
swc_atoms = "9.0.3"
swc_common = "23.0.2"
swc_ecma_ast = "25.0.0"
swc_ecma_codegen = "28.0.2"
swc_ecma_parser = "41.1.2"
swc_ecma_transforms_macros = "1.0.1"
swc_ecma_transforms_react = "50.0.0"
swc_ecma_transforms_typescript = { version = "50.0.0", features = ["concurrent"] }
swc_ecma_visit = { version = "25.0.0", features = ["serde"] }
tiktoken = { version = "4.1.2", features = ["rayon"] }
tokenizers = "0.23.1"
tokio = { version = "1.53.0", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

